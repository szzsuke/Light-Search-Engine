name: Daily Web Crawl & Indexing

on:
  schedule:
    # Runs daily at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub UI
    inputs:
      pages:
        description: 'Number of new pages to crawl'
        required: false
        default: '25000'

jobs:
  daily-crawl-and-index:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Max 6 hours execution limit on GitHub Actions free tier

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 25k Nightly Crawl, BM25 Indexing & PageRank
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME || 'entertainment_search' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAILY_PAGES: ${{ github.event.inputs.pages || '25000' }}
        run: |
          python daily_crawl.py --pages ${{ github.event.inputs.pages || '25000' }}

      - name: Verify Index & Print Summary
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME || 'entertainment_search' }}
        run: |
          python -c "from pymongo import MongoClient; import os; c = MongoClient(os.environ['MONGO_URI']); db = c[os.environ.get('MONGO_DB_NAME', 'entertainment_search')]; print('=== CLOUD DATABASE STATUS ==='); print('Total Raw Pages:', db['raw_pages'].count_documents({})); print('Indexed Terms:', db['inverted_index'].count_documents({})); print('PageRank Scores:', db['page_rank'].count_documents({}))"
